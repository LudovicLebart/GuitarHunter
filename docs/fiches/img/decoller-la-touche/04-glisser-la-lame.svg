<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Glisser la lame sous la rallonge</title>
  <desc id="d">Coupe latérale : une spatule fine est glissée entre la rallonge et la table, de la ouïe vers le joint, en restant à plat.</desc>
  <rect width="820" height="320" fill="#f8fafc"/>
<rect x="20" y="161" width="170" height="79" fill="#7c4a1e"/><rect x="20" y="152" width="650" height="9" fill="#1e293b" stroke="#475569" stroke-width="2"/><rect x="190" y="161" width="480" height="9" fill="#fbbf24" stroke="#a16207" stroke-width="2"/><rect x="190" y="170" width="570" height="14" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/>
  <polygon points="690,162 360,164 360,168 690,170" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <rect x="690" y="158" width="70" height="16" rx="6" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/>
  <path d="M620 114 L460 114" stroke="#334155" stroke-width="3" fill="none"/><polygon points="460,114 472.9,108.5 472.9,119.5" fill="#334155"/>
  <circle cx="540" cy="80" r="15" fill="#0f172a"/><text x="540" y="86" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <circle cx="400" cy="232" r="15" fill="#0f172a"/><text x="400" y="238" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <text x="562" y="86" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Elle progresse vers le joint</text>
  <text x="422" y="238" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Lame fine, à plat, sans entailler la table</text>
  <text x="410" y="28" font-size="16" fill="#334155" font-weight="bold" text-anchor="middle">La lame doit entrer sans résistance : sinon, rechauffer</text>
  <text x="410" y="262" font-size="14" fill="#334155" text-anchor="middle">Le bois de la table est plus tendre que la touche : une lame qui force l'entame ou l'arrache.</text>
  <text x="410" y="284" font-size="14" fill="#334155" text-anchor="middle">Si la lame résiste, remettre la protection et rechauffer environ une minute.</text>
</svg>
