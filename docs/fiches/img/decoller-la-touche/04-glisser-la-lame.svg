<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Glisser la lame sous la rallonge</title>
  <desc id="d">Coupe latérale : une spatule fine est glissée entre la rallonge et la table, de la rosace vers le joint, en restant à plat.</desc>
  <rect width="820" height="400" fill="#f8fafc"/>
<text x="410" y="30" font-size="16" fill="#334155" font-weight="bold" text-anchor="middle">La lame doit entrer sans résistance : sinon, rechauffer</text>
  <rect x="330" y="150" width="46" height="140" fill="#e8cf9b" stroke="#7c4a1e" stroke-width="2"/><rect x="376" y="150" width="144" height="12" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/><rect x="660" y="150" width="70" height="12" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/><rect x="330" y="290" width="400" height="10" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/><line x1="330" y1="150" x2="330" y2="300" stroke="#7c4a1e" stroke-width="4"/><text x="590.0" y="184" font-size="13" fill="#334155" text-anchor="middle">rosace</text><polygon points="330.0,150.0 366.0,150.0 366.0,200.0 330.0,200.0" fill="#7c4a1e" stroke="#7c4a1e" stroke-width="2"/><polygon points="40.0,150.0 330.0,150.0 330.0,270.0 268.0,270.0 268.0,184.0 40.0,184.0" fill="#7c4a1e" stroke="#7c4a1e" stroke-width="2"/><polygon points="40.0,140.0 500.0,140.0 500.0,150.0 40.0,150.0" fill="#1e293b" stroke="#475569" stroke-width="2"/><line x1="52.0" y1="137.0" x2="52.0" y2="140.0" stroke="#cbd5e1" stroke-width="3"/><line x1="90.0" y1="137.0" x2="90.0" y2="140.0" stroke="#cbd5e1" stroke-width="3"/><line x1="128.0" y1="137.0" x2="128.0" y2="140.0" stroke="#cbd5e1" stroke-width="3"/><line x1="166.0" y1="137.0" x2="166.0" y2="140.0" stroke="#cbd5e1" stroke-width="3"/><line x1="205.0" y1="137.0" x2="205.0" y2="140.0" stroke="#cbd5e1" stroke-width="3"/><line x1="245.0" y1="137.0" x2="245.0" y2="140.0" stroke="#cbd5e1" stroke-width="3"/><line x1="286.0" y1="137.0" x2="286.0" y2="140.0" stroke="#cbd5e1" stroke-width="3"/><line x1="328.0" y1="137.0" x2="328.0" y2="140.0" stroke="#cbd5e1" stroke-width="3"/><line x1="370.0" y1="137.0" x2="370.0" y2="140.0" stroke="#cbd5e1" stroke-width="3"/><line x1="410.0" y1="137.0" x2="410.0" y2="140.0" stroke="#cbd5e1" stroke-width="3"/><line x1="448.0" y1="137.0" x2="448.0" y2="140.0" stroke="#cbd5e1" stroke-width="3"/><line x1="484.0" y1="137.0" x2="484.0" y2="140.0" stroke="#cbd5e1" stroke-width="3"/><rect x="376" y="147" width="124" height="3" fill="#fbbf24" stroke="#a16207" stroke-width="1"/>
