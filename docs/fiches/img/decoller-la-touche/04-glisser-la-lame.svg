  <text x="620" y="80" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Elle progresse vers le joint</text>
  <text x="442" y="212" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Lame fine, à plat, sans entailler la table</text>
  <text x="410" y="336" font-size="14" fill="#334155" text-anchor="middle">Le bois de la table est plus tendre que la touche : une lame qui force l'entame ou l'arrache.</text>
  <text x="410" y="358" font-size="14" fill="#334155" text-anchor="middle">Si la lame résiste, remettre la protection et rechauffer environ une minute.</text>
</svg>
