  <text x="562" y="62" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Cale de bois : serrage léger</text>
  <text x="562" y="98" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Couverture chauffante (ou fer)</text>
  <text x="562" y="134" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Feuille d'aluminium</text>
  <text x="410" y="336" font-size="14" fill="#334155" text-anchor="middle">Source de chaleur : couverture chauffante, ou fer à souder sur un bloc d'aluminium.</text>
  <text x="410" y="358" font-size="14" fill="#334155" text-anchor="middle">Ne jamais laisser la couverture chauffante reposer sur le vernis de la guitare.</text>
  <text x="410" y="380" font-size="14" fill="#334155" text-anchor="middle">Les incrustations de touche peuvent roussir ou fondre : les couvrir d'aluminium.</text>
