<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Chercher un boulon sous la rallonge</title>
  <desc id="d">Coupe latérale : certaines guitares ont un ou deux boulons qui tiennent la rallonge à la table ; on regarde avec un miroir avant de chauffer.</desc>
  <rect width="820" height="290" fill="#f8fafc"/>
<rect x="20" y="161" width="170" height="79" fill="#7c4a1e"/><rect x="20" y="152" width="650" height="9" fill="#1e293b" stroke="#475569" stroke-width="2"/><rect x="190" y="161" width="480" height="9" fill="#fbbf24" stroke="#a16207" stroke-width="2"/><rect x="190" y="170" width="570" height="14" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/>
  <rect x="390" y="161" width="12" height="40" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <rect x="382" y="184" width="28" height="8" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <circle cx="396" cy="242" r="15" fill="#0f172a"/><text x="396" y="248" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <path d="M396 228 V204" stroke="#334155" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="420" y="248" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Boulon éventuel, vu depuis l'intérieur de la caisse</text>
  <text x="410" y="30" font-size="16" fill="#334155" font-weight="bold" text-anchor="middle">Avant de chauffer : chercher un boulon qui tient la rallonge</text>
  <text x="410" y="262" font-size="14" fill="#334155" text-anchor="middle">Regarder avec un miroir et une lampe par la rosace. Avec un boulon, la rallonge se dévisse.</text>
</svg>
