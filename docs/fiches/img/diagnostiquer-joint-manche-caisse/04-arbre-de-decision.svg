<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 570" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Arbre de décision du diagnostic du joint manche-caisse</title>
  <desc id="d">Selon le trait de crayon qui se casse sous tension : queue d'aronde lâche, bloc décollé, ou talon et éclisse seuls. Contrôle en parallèle de la table.</desc>
  <rect width="820" height="570" fill="#f8fafc"/>
<rect x="280" y="20" width="260" height="70" rx="10" fill="#fff" stroke="#0284c7" stroke-width="3"/><text x="410.0" y="48" font-size="15" fill="#0284c7" font-weight="bold" text-anchor="middle">Test des témoins au crayon</text><text x="410.0" y="70" font-size="13" fill="#334155" text-anchor="middle">Un ton plus bas, 10 à 15 min</text>
  <path d="M410 90 L410 125" stroke="#334155" stroke-width="3" fill="none"/><polygon points="410,125 404.5,112.1 415.5,112.1" fill="#334155"/>
  <rect x="280" y="125" width="260" height="70" rx="10" fill="#fff" stroke="#0284c7" stroke-width="3"/><text x="410.0" y="153" font-size="15" fill="#0284c7" font-weight="bold" text-anchor="middle">Quel trait se casse ?</text><text x="410.0" y="175" font-size="13" fill="#334155" text-anchor="middle">Photos avant / après</text>
  <path d="M410 195 L130 245" stroke="#475569" stroke-width="2" fill="none"/><polygon points="130,245 141.7,237.4 143.7,248.1" fill="#475569"/>
  <rect x="20" y="245" width="220" height="70" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="3"/><text x="130.0" y="273" font-size="15" fill="#b91c1c" font-weight="bold" text-anchor="middle">Trapèze / bloc</text><text x="130.0" y="295" font-size="13" fill="#334155" text-anchor="middle">Queue d'aronde lâche</text><text x="130.0" y="313" font-size="13" fill="#334155" text-anchor="middle">(cas A)</text>
  <path d="M130 315 L130 345" stroke="#475569" stroke-width="2" fill="none"/><polygon points="130,345 124.5,332.1 135.5,332.1" fill="#475569"/>
  <rect x="20" y="345" width="220" height="90" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="3"/><text x="130.0" y="373" font-size="15" fill="#b91c1c" font-weight="bold" text-anchor="middle">Ensuite</text><text x="130.0" y="395" font-size="13" fill="#334155" text-anchor="middle">Dépose du manche ou</text><text x="130.0" y="413" font-size="13" fill="#334155" text-anchor="middle">conversion en vissé</text><text x="130.0" y="431" font-size="13" fill="#334155" text-anchor="middle">Avis du luthier d'abord</text>
  <path d="M410 195 L410 245" stroke="#475569" stroke-width="2" fill="none"/><polygon points="410,245 404.5,232.1 415.5,232.1" fill="#475569"/>
  <rect x="300" y="245" width="220" height="70" rx="10" fill="#fff" stroke="#15803d" stroke-width="3"/><text x="410.0" y="273" font-size="15" fill="#15803d" font-weight="bold" text-anchor="middle">Bloc / dos ou éclisses</text><text x="410.0" y="295" font-size="13" fill="#334155" text-anchor="middle">Bloc décollé</text><text x="410.0" y="313" font-size="13" fill="#334155" text-anchor="middle">(cas C ou D)</text>
  <path d="M410 315 L410 345" stroke="#475569" stroke-width="2" fill="none"/><polygon points="410,345 404.5,332.1 415.5,332.1" fill="#475569"/>
  <rect x="300" y="345" width="220" height="90" rx="10" fill="#fff" stroke="#15803d" stroke-width="3"/><text x="410.0" y="373" font-size="15" fill="#15803d" font-weight="bold" text-anchor="middle">Ensuite</text><text x="410.0" y="395" font-size="13" fill="#334155" text-anchor="middle">Recoller le bloc</text><text x="410.0" y="413" font-size="13" fill="#334155" text-anchor="middle">(branche 1)</text><text x="410.0" y="431" font-size="13" fill="#334155" text-anchor="middle">Serrage à blanc d'abord</text>
  <path d="M410 195 L690 245" stroke="#475569" stroke-width="2" fill="none"/><polygon points="690,245 676.3,248.1 678.3,237.4" fill="#475569"/>
  <rect x="580" y="245" width="220" height="70" rx="10" fill="#fff" stroke="#15803d" stroke-width="3"/><text x="690.0" y="273" font-size="15" fill="#15803d" font-weight="bold" text-anchor="middle">Aucun, jour visible</text><text x="690.0" y="295" font-size="13" fill="#334155" text-anchor="middle">Talon / éclisse seul</text><text x="690.0" y="313" font-size="13" fill="#334155" text-anchor="middle">(cas B)</text>
  <path d="M690 315 L690 345" stroke="#475569" stroke-width="2" fill="none"/><polygon points="690,345 684.5,332.1 695.5,332.1" fill="#475569"/>
  <rect x="580" y="345" width="220" height="90" rx="10" fill="#fff" stroke="#15803d" stroke-width="3"/><text x="690.0" y="373" font-size="15" fill="#15803d" font-weight="bold" text-anchor="middle">Ensuite</text><text x="690.0" y="395" font-size="13" fill="#334155" text-anchor="middle">Recoller l'éclisse</text><text x="690.0" y="413" font-size="13" fill="#334155" text-anchor="middle">et le liseré</text><text x="690.0" y="431" font-size="13" fill="#334155" text-anchor="middle">(branche 1)</text>
  <rect x="280" y="455" width="260" height="70" rx="10" fill="#fff" stroke="#dc2626" stroke-width="3"/><text x="410.0" y="483" font-size="15" fill="#dc2626" font-weight="bold" text-anchor="middle">En parallèle : ligne dans la table ?</text><text x="410.0" y="505" font-size="13" fill="#334155" text-anchor="middle">Regarder de l'intérieur</text>
  <text x="410" y="550" font-size="14" fill="#334155" text-anchor="middle">Fissure confirmée : la réparer avant de retendre les cordes.</text>
</svg>
