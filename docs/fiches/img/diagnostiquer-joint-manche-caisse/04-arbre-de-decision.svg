<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 605" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Arbre de décision du diagnostic du joint manche-caisse</title>
  <desc id="d">Selon le trait qui se casse sous tension : queue d'aronde lâche, bloc ou dos décollé. Sans trait cassé, une règle trop basse sur le chevalet indique un angle de manche refermé ; sinon, talon et éclisse seuls. Contrôle en parallèle de la table.</desc>
  <rect width="820" height="605" fill="#f8fafc"/>
<rect x="280" y="20" width="260" height="70" rx="10" fill="#fff" stroke="#0284c7" stroke-width="3"/><text x="410.0" y="48" font-size="15" fill="#0284c7" font-weight="bold" text-anchor="middle">Fenêtre de tension (étape 5)</text><text x="410.0" y="70" font-size="13" fill="#334155" text-anchor="middle">Témoins, cales, action, règle</text>
  <path d="M410 90 L410 125" stroke="#334155" stroke-width="3" fill="none"/><polygon points="410,125 404.5,112.1 415.5,112.1" fill="#334155"/>
  <rect x="280" y="125" width="260" height="70" rx="10" fill="#fff" stroke="#0284c7" stroke-width="3"/><text x="410.0" y="153" font-size="15" fill="#0284c7" font-weight="bold" text-anchor="middle">Un trait se casse-t-il ?</text><text x="410.0" y="175" font-size="13" fill="#334155" text-anchor="middle">Photos avant / après</text>
  <path d="M410 195 L110 245" stroke="#475569" stroke-width="2" fill="none"/><polygon points="110,245 121.8,237.5 123.6,248.3" fill="#475569"/>
  <rect x="15" y="245" width="190" height="80" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="3"/><text x="110.0" y="273" font-size="15" fill="#b91c1c" font-weight="bold" text-anchor="middle">Tenon / bloc</text><text x="110.0" y="295" font-size="13" fill="#334155" text-anchor="middle">Queue d'aronde lâche</text>
  <path d="M110 325 L110 355" stroke="#475569" stroke-width="2" fill="none"/><polygon points="110,355 104.5,342.1 115.5,342.1" fill="#475569"/>
  <rect x="15" y="355" width="190" height="100" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="3"/><text x="110.0" y="383" font-size="15" fill="#b91c1c" font-weight="bold" text-anchor="middle">Ensuite</text><text x="110.0" y="405" font-size="13" fill="#334155" text-anchor="middle">Dépose du manche ou</text><text x="110.0" y="423" font-size="13" fill="#334155" text-anchor="middle">conversion en vissé :</text><text x="110.0" y="441" font-size="13" fill="#334155" text-anchor="middle">avis du luthier d'abord</text>
  <path d="M410 195 L310 245" stroke="#475569" stroke-width="2" fill="none"/><polygon points="310,245 319.1,234.4 324.0,244.1" fill="#475569"/>
  <rect x="215" y="245" width="190" height="80" rx="10" fill="#fff" stroke="#15803d" stroke-width="3"/><text x="310.0" y="273" font-size="15" fill="#15803d" font-weight="bold" text-anchor="middle">Bloc / dos / éclisses</text><text x="310.0" y="295" font-size="13" fill="#334155" text-anchor="middle">Bloc ou dos décollé</text>
  <path d="M310 325 L310 355" stroke="#475569" stroke-width="2" fill="none"/><polygon points="310,355 304.5,342.1 315.5,342.1" fill="#475569"/>
  <rect x="215" y="355" width="190" height="100" rx="10" fill="#fff" stroke="#15803d" stroke-width="3"/><text x="310.0" y="383" font-size="15" fill="#15803d" font-weight="bold" text-anchor="middle">Ensuite</text><text x="310.0" y="405" font-size="13" fill="#334155" text-anchor="middle">Recoller le bloc ou le</text><text x="310.0" y="423" font-size="13" fill="#334155" text-anchor="middle">joint dos/éclisse.</text><text x="310.0" y="441" font-size="13" fill="#334155" text-anchor="middle">Serrage à blanc d'abord</text>
  <text x="275" y="232" font-size="13" fill="#334155" font-weight="bold" text-anchor="start">oui</text>
  <path d="M410 195 L610 245" stroke="#475569" stroke-width="2" fill="none"/><polygon points="610,245 596.2,247.2 598.8,236.6" fill="#475569"/>
  <text x="560" y="222" font-size="13" fill="#334155" font-weight="bold" text-anchor="start">non</text>
  <rect x="415" y="245" width="390" height="80" rx="10" fill="#fff" stroke="#0284c7" stroke-width="3"/><text x="610.0" y="273" font-size="15" fill="#0284c7" font-weight="bold" text-anchor="middle">Aucun trait ne casse</text><text x="610.0" y="295" font-size="13" fill="#334155" text-anchor="middle">La règle sur les frettes</text><text x="610.0" y="313" font-size="13" fill="#334155" text-anchor="middle">atterrit-elle trop bas ?</text>
  <path d="M510 325 L510 355" stroke="#475569" stroke-width="2" fill="none"/><polygon points="510,355 504.5,342.1 515.5,342.1" fill="#475569"/>
  <rect x="415" y="355" width="190" height="100" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="3"/><text x="510.0" y="383" font-size="15" fill="#b91c1c" font-weight="bold" text-anchor="middle">Oui : angle refermé</text><text x="510.0" y="405" font-size="13" fill="#334155" text-anchor="middle">Refaire l'angle du</text><text x="510.0" y="423" font-size="13" fill="#334155" text-anchor="middle">manche (neck reset)</text>
  <path d="M710 325 L710 355" stroke="#475569" stroke-width="2" fill="none"/><polygon points="710,355 704.5,342.1 715.5,342.1" fill="#475569"/>
  <rect x="615" y="355" width="190" height="100" rx="10" fill="#fff" stroke="#15803d" stroke-width="3"/><text x="710.0" y="383" font-size="15" fill="#15803d" font-weight="bold" text-anchor="middle">Non : talon / éclisse</text><text x="710.0" y="405" font-size="13" fill="#334155" text-anchor="middle">Recoller l'éclisse</text><text x="710.0" y="423" font-size="13" fill="#334155" text-anchor="middle">et le liseré</text>
  <rect x="280" y="485" width="260" height="70" rx="10" fill="#fff" stroke="#dc2626" stroke-width="3"/><text x="410.0" y="513" font-size="15" fill="#dc2626" font-weight="bold" text-anchor="middle">En parallèle : ligne dans la table ?</text><text x="410.0" y="535" font-size="13" fill="#334155" text-anchor="middle">Regarder de l'intérieur</text>
  <text x="410" y="585" font-size="14" fill="#334155" text-anchor="middle">Fissure confirmée : la réparer avant de retendre les cordes.</text>
</svg>
