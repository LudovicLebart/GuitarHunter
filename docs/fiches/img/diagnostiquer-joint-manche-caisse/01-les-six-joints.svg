<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Les six joints possibles d'un talon qui se décolle</title>
  <desc id="d">Deux coupes simplifiées d'une guitare acoustique : dans l'axe et vue de dessus. Six joints numérotés : queue d'aronde et bloc, bloc et table, bloc et dos, talon et bloc, talon et éclisse, bloc et éclisse.</desc>
  <rect width="820" height="440" fill="#f8fafc"/>
<text x="210" y="34" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle">A. Coupe dans l'axe de la guitare</text>
  <rect x="20" y="95" width="120" height="40" fill="#7c4a1e" stroke="#475569" stroke-width="2"/>
  <rect x="100" y="95" width="40" height="205" fill="#7c4a1e" stroke="#475569" stroke-width="2"/>
  <rect x="140" y="120" width="70" height="170" fill="#e5c98f" stroke="#7c4a1e" stroke-width="2"/>
  <rect x="140" y="110" width="250" height="10" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/>
  <rect x="140" y="290" width="250" height="10" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/>
  <polygon points="140,140 195,150 195,215 140,225" fill="#7c4a1e" stroke="#475569" stroke-width="2"/>
  <text x="272" y="205" font-size="14" fill="#334155" text-anchor="middle">caisse vide</text>
  <circle cx="168" cy="183" r="15" fill="#dc2626"/><text x="168" y="189" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <circle cx="250" cy="100" r="15" fill="#dc2626"/><text x="250" y="106" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <circle cx="250" cy="316" r="15" fill="#dc2626"/><text x="250" y="322" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <circle cx="122" cy="260" r="15" fill="#dc2626"/><text x="122" y="266" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
  <text x="155" y="142" font-size="13" fill="#334155" text-anchor="start">queue d'aronde</text>
  <text x="615" y="34" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle">B. Coupe horizontale, vue de dessus</text>
  <rect x="380" y="150" width="90" height="70" fill="#7c4a1e" stroke="#475569" stroke-width="2"/>
  <rect x="470" y="120" width="50" height="130" fill="#7c4a1e" stroke="#475569" stroke-width="2"/>
  <rect x="520" y="120" width="70" height="130" fill="#e5c98f" stroke="#7c4a1e" stroke-width="2"/>
  <rect x="470" y="108" width="320" height="12" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/>
  <rect x="470" y="250" width="320" height="12" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/>
  <polygon points="520,140 575,148 575,222 520,230" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="690" y="192" font-size="14" fill="#334155" text-anchor="middle">caisse vide</text>
  <circle cx="495" cy="100" r="15" fill="#dc2626"/><text x="495" y="106" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
  <circle cx="555" cy="100" r="15" fill="#dc2626"/><text x="555" y="106" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
  <circle cx="495" cy="270" r="15" fill="#dc2626"/><text x="495" y="276" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
  <circle cx="555" cy="270" r="15" fill="#dc2626"/><text x="555" y="276" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
  <circle cx="40" cy="350" r="15" fill="#dc2626"/><text x="40" y="356" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="65" y="356" font-size="15" fill="#0f172a" text-anchor="start">queue d'aronde / bloc</text>
  <circle cx="40" cy="382" r="15" fill="#dc2626"/><text x="40" y="388" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="65" y="388" font-size="15" fill="#0f172a" text-anchor="start">bloc / table</text>
  <circle cx="40" cy="414" r="15" fill="#dc2626"/><text x="40" y="420" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="65" y="420" font-size="15" fill="#0f172a" text-anchor="start">bloc / dos</text>
  <circle cx="310" cy="350" r="15" fill="#dc2626"/><text x="310" y="356" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="335" y="356" font-size="15" fill="#0f172a" text-anchor="start">talon / bloc</text>
  <circle cx="310" cy="382" r="15" fill="#dc2626"/><text x="310" y="388" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="335" y="388" font-size="15" fill="#0f172a" text-anchor="start">talon / éclisse</text>
  <circle cx="310" cy="414" r="15" fill="#dc2626"/><text x="310" y="420" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">6</text><text x="335" y="420" font-size="15" fill="#0f172a" text-anchor="start">bloc / éclisse</text>
  <text x="560" y="358" font-size="14" fill="#334155" text-anchor="start">Chaque numéro est un joint collé</text>
  <text x="560" y="378" font-size="14" fill="#334155" text-anchor="start">qui peut lâcher. Lequel ?</text>
  <text x="560" y="410" font-size="13" fill="#334155" text-anchor="start">Schéma simplifié, hors proportions.</text>
</svg>
