<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 415" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Témoins au crayon sur un joint</title>
  <desc id="d">À gauche, un trait traverse le joint talon/éclisse et reste aligné (cordes détendues). À droite, après un accordage plus bas, le trait est décalé de part et d'autre du joint : ce joint travaille.</desc>
  <rect width="820" height="415" fill="#f8fafc"/>
<text x="150" y="34" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle">Cordes détendues (référence)</text>
  <text x="550" y="34" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle">Accordé un ton plus bas, 10 à 15 min</text>
  <rect x="30" y="110" width="110" height="150" fill="#7c4a1e" stroke="#475569" stroke-width="2"/><rect x="160" y="110" width="110" height="150" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/><text x="85" y="135" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">talon</text><text x="215" y="135" font-size="14" fill="#7c4a1e" font-weight="bold" text-anchor="middle">éclisse</text><line x1="60" y1="185" x2="140" y2="185" stroke="#fff" stroke-width="4"/><line x1="160" y1="185" x2="240" y2="185" stroke="#1e293b" stroke-width="4"/>
  <rect x="430" y="110" width="110" height="150" fill="#7c4a1e" stroke="#475569" stroke-width="2"/><rect x="560" y="110" width="110" height="150" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/><text x="485" y="135" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">talon</text><text x="615" y="135" font-size="14" fill="#7c4a1e" font-weight="bold" text-anchor="middle">éclisse</text><line x1="460" y1="185" x2="540" y2="185" stroke="#fff" stroke-width="4"/><line x1="560" y1="211" x2="640" y2="211" stroke="#1e293b" stroke-width="4"/>
  <text x="150" y="285" font-size="14" fill="#334155" text-anchor="middle">Le trait reste aligné de part et d'autre</text>
  <text x="550" y="285" font-size="14" fill="#334155" text-anchor="middle">Le trait est décalé : ce joint travaille</text>
  <circle cx="150" cy="325" r="16" fill="#15803d"/><text x="150" y="332" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">✓</text>
  <circle cx="550" cy="325" r="16" fill="#b91c1c"/><text x="550" y="332" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">✗</text>
  <path d="M620 187 L620 210" stroke="#dc2626" stroke-width="3" fill="none"/><polygon points="620,210 614.5,197.1 625.5,197.1" fill="#dc2626"/>
  <text x="640" y="205" font-size="13" fill="#dc2626" font-weight="bold" text-anchor="start">décalage</text>
  <text x="410" y="370" font-size="14" fill="#334155" text-anchor="middle">Même trait, même endroit, même distance de l'appareil photo, avec une règle dans le cadre.</text>
  <text x="410" y="394" font-size="14" fill="#334155" text-anchor="middle">Sur un fini noir : crayon gras blanc, ou deux bandes de ruban de masquage portant le même trait.</text>
</svg>
