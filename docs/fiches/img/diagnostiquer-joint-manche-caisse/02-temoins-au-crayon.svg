<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Témoins au crayon sur un joint</title>
  <desc id="d">À gauche, un trait de crayon traverse un joint sans cassure (cordes détendues). À droite, après un accordage plus bas, le trait est décalé de part et d'autre du joint : ce joint travaille.</desc>
  <rect width="820" height="390" fill="#f8fafc"/>
<text x="150" y="34" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle">Cordes détendues (référence)</text>
  <text x="550" y="34" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle">Accordé un ton plus bas, 10 à 15 min</text>
  <rect x="30" y="110" width="110" height="150" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/><rect x="160" y="110" width="110" height="150" fill="#e5c98f" stroke="#7c4a1e" stroke-width="2"/><rect x="140" y="110" width="20" height="150" fill="#f8fafc"/><line x1="140" y1="110" x2="140" y2="260" stroke="#475569" stroke-width="2"/><line x1="160" y1="110" x2="160" y2="260" stroke="#475569" stroke-width="2"/><line x1="60" y1="185" x2="140" y2="185" stroke="#1e293b" stroke-width="4"/><line x1="160" y1="185" x2="240" y2="185" stroke="#1e293b" stroke-width="4"/>
  <rect x="430" y="110" width="110" height="150" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/><rect x="560" y="110" width="110" height="150" fill="#e5c98f" stroke="#7c4a1e" stroke-width="2"/><rect x="540" y="110" width="20" height="150" fill="#f8fafc"/><line x1="540" y1="110" x2="540" y2="260" stroke="#475569" stroke-width="2"/><line x1="560" y1="110" x2="560" y2="260" stroke="#475569" stroke-width="2"/><line x1="460" y1="185" x2="540" y2="185" stroke="#1e293b" stroke-width="4"/><line x1="560" y1="211" x2="640" y2="211" stroke="#1e293b" stroke-width="4"/>
  <text x="150" y="285" font-size="14" fill="#334155" text-anchor="middle">Le trait traverse le joint sans cassure</text>
  <text x="550" y="285" font-size="14" fill="#334155" text-anchor="middle">Le trait est cassé : ce joint travaille</text>
  <circle cx="150" cy="325" r="16" fill="#15803d"/><text x="150" y="332" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">✓</text>
  <circle cx="550" cy="325" r="16" fill="#b91c1c"/><text x="550" y="332" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">✗</text>
  <path d="M620 187 L620 210" stroke="#dc2626" stroke-width="3" fill="none"/><polygon points="620,210 614.5,197.1 625.5,197.1" fill="#dc2626"/>
  <text x="640" y="205" font-size="13" fill="#dc2626" font-weight="bold" text-anchor="start">décalage</text>
  <text x="410" y="365" font-size="14" fill="#334155" text-anchor="middle">Même trait, même endroit, même distance de l'appareil photo, avec une règle dans le cadre.</text>
</svg>
