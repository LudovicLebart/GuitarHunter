<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Tracer et percer la cale</title>
  <desc id="d">Vue de dessus : un morceau d'érable un peu plus grand que la poche, le contour du talon tracé au crayon, quatre trous aux vis, épais côté chevalet.</desc>
  <rect width="820" height="340" fill="#f8fafc"/>
<text x="410" y="30" font-size="16" fill="#334155" font-weight="bold" text-anchor="middle">Vue de dessus de la cale</text>
  <rect x="120" y="60" width="440" height="190" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="150" y="80" width="380" height="150" rx="14" fill="#fbbf24" stroke="#a16207" stroke-width="3"/>
  <circle cx="200" cy="110" r="11" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <circle cx="200" cy="200" r="11" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <circle cx="480" cy="110" r="11" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <circle cx="480" cy="200" r="11" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <path d="M430 270 L520 270" stroke="#334155" stroke-width="3" fill="none"/><polygon points="520,270 507.1,275.5 507.1,264.5" fill="#334155"/>
  <text x="150" y="274" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Côté tête : presque nul</text>
  <text x="530" y="274" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Côté chevalet : plus épais</text>
  <circle cx="584" cy="90" r="15" fill="#0f172a"/><text x="584" y="96" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <circle cx="584" cy="155" r="15" fill="#0f172a"/><text x="584" y="161" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <circle cx="584" cy="220" r="15" fill="#0f172a"/><text x="584" y="226" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <text x="606" y="96" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Pièce un peu plus grande</text>
  <text x="606" y="161" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Contour du talon (crayon)</text>
  <text x="606" y="226" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Trous : poinçon ou mèche</text>
  <text x="410" y="316" font-size="14" fill="#334155" text-anchor="middle">Départ vers 1,5 mm (0,060 po) ; au dos, 0,5 à 1 mm une fois en coin. Épaisseurs à ajuster par essais.</text>
</svg>
