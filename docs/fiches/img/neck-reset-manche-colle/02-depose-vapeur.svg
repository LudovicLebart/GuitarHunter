<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Déposer le manche à la vapeur</title>
  <desc id="d">Coupe latérale : un trou dans la fente de la frette 15 rejoint le vide au fond de la queue d'aronde ; une aiguille y envoie un peu de vapeur pendant qu'on ébranle le manche en le tirant vers le haut.</desc>
  <rect width="820" height="440" fill="#f8fafc"/>
<text x="410" y="30" font-size="16" fill="#334155" font-weight="bold" text-anchor="middle">Très peu de vapeur, puis on ébranle le manche avant de le sortir</text>
