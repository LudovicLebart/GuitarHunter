  <text x="40" y="346" font-size="14" fill="#0f172a" text-anchor="start">1  Trou de 2,5 mm dans la fente de la frette 15 (frette retirée), aiguille de vapeur, chiffon autour</text>
  <text x="40" y="368" font-size="14" fill="#0f172a" text-anchor="start">2  Vide au fond de la queue d'aronde, que le trou rejoint</text>
  <text x="40" y="390" font-size="14" fill="#0f172a" text-anchor="start">3  Chiffons secs dans la caisse, autour de la zone du manche</text>
  <text x="40" y="412" font-size="14" fill="#0f172a" text-anchor="start">4  Tirer le manche vers le haut, en l'ébranlant ; ne jamais forcer : un talon qui casse est pire qu'une vapeur de plus</text>
</svg>
