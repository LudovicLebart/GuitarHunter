  <line x1="480" y1="220" x2="440" y2="270" stroke="#0f172a" stroke-width="1.5"/><circle cx="440" cy="270" r="3.5" fill="#0f172a"/><circle cx="480" cy="220" r="15" fill="#0f172a"/><text x="480" y="226" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
