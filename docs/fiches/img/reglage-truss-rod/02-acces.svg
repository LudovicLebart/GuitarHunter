  <text x="210" y="60" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="middle">Accès côté tête</text>
  <text x="210" y="275" font-size="14" fill="#334155" text-anchor="middle">Derrière un cache ou sous le sillet</text>
  <text x="210" y="295" font-size="14" fill="#334155" text-anchor="middle">(fréquent sur les électriques)</text>
  <text x="620" y="60" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="middle">Accès côté corps</text>
  <text x="620" y="275" font-size="14" fill="#334155" text-anchor="middle">Par la rosace ou sous le pickguard</text>
  <text x="620" y="295" font-size="14" fill="#334155" text-anchor="middle">(fréquent sur les acoustiques)</text>
  <text x="410" y="335" font-size="14" fill="#334155" text-anchor="middle">Simple action : redresse seulement le manche. Double action : redresse et creuse. Identifier le type avant d'intervenir.</text>
</svg>
