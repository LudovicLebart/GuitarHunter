<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 355" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Où se trouve l'accès du truss rod</title>
  <desc id="d">Deux guitares vues de dessus : à gauche l'accès du truss rod côté tête, à droite côté corps par la rosace.</desc>
  <rect width="820" height="355" fill="#f8fafc"/>
