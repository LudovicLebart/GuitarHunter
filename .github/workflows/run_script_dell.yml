# Workflow d'exécution ponctuelle sur le Dell GPU de MoneyBot (100.94.33.54, tailnet partagé —
# connectivité + accès SSH confirmés le 2026-08-19, `NECK_RESET_VISION_PLAN.md` §7), envisagé
# comme ressource de calcul pour l'inférence vision Phase 0/1 (Florence-2/OWLv2/SAM 2.1) sur le
# Dataset A du projet neck-reset.
#
# Distinct de run_script.yml (qui cible le serveur de production GuitarHunter) : cible une
# machine tierce (le Dell de MoneyBot), avec un secret d'accès dédié (`DELL_SSH_PRIVATE_KEY`,
# clé ed25519 générée spécifiquement pour cet usage, ajoutée aux `authorized_keys` du Dell —
# pas la clé MoneyBot existante, pour garder les deux accès révocables indépendamment).
#
# Répertoire scratch dédié sur le Dell (~/GuitareHunter-scripts), même logique que run_script.yml
# côté serveur de production : jamais ~/MoneyBot, jamais d'interférence avec le cluster Ray actif.
#
# Étape actuelle (§7 étape 4) : backend/scripts/test_dell_vision_inference.py — valide qu'OWLv2-base
# tourne en inférence dans les 8 Go de VRAM sur un petit échantillon réel du Dataset A (Florence-2
# essayé en premier, écarté après échec de compatibilité `trust_remote_code`, voir le script).
# Premier run lent (installation torch/transformers + téléchargement du modèle, ~1 Go) — timeout
# généreux en conséquence.
#
# Usage : pousser sur `ops/run-script` (même mécanisme que run_script.yml).
name: Run One-Off Script (Dell GPU)

on:
  push:
    branches: [ ops/run-script ]

jobs:
  run-on-dell:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Exécution du script d'inférence sur le Dell
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 100.94.33.54
          username: ludovic
          key: ${{ secrets.DELL_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e
            mkdir -p ~/GuitareHunter-scripts
            cd ~/GuitareHunter-scripts

            echo "--- Git Update (répertoire scratch, distinct de ~/MoneyBot) ---"
            if [ ! -d ".git" ]; then
              git init -q
              git remote add origin https://github.com/${{ github.repository }}.git
            fi
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            echo "--- Python Environment (venv dédié vision, distinct de .venv MoneyBot) ---"
            python3 -m venv venv_vision || echo "Venv déjà présent."
            source venv_vision/bin/activate
            pip install --upgrade pip --quiet
            pip install torch transformers pillow requests --quiet

            echo "--- GPU avant chargement du modèle ---"
            nvidia-smi --query-gpu=memory.used,memory.total --format=csv

            echo "--- Exécution du test d'inférence ---"
            python3 backend/scripts/test_dell_vision_inference.py
