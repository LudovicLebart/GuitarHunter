# Workflow de TEST (étape 1 du plan `NECK_RESET_VISION_PLAN.md` §4/point Dell) : vérifie si le
# tailnet Tailscale utilisé par GuitarHunter (client OAuth `tag:ci`, secrets TS_OAUTH_CLIENT_ID/
# TS_OAUTH_SECRET, déjà utilisés par deploy.yml et run_script.yml) atteint le Dell Precision T5810
# de MoneyBot (100.94.33.54, doc `moneybot/config/cluster_machines.json` — machine avec GPU
# RTX 2070 SE 8 Go VRAM, envisagée comme ressource de calcul pour l'inférence vision Phase 0/1).
#
# Ne fait qu'un `tailscale ping` — PAS de connexion SSH, aucun secret d'accès au Dell n'existe
# encore côté GuitarHunter (à ajouter séparément si ce test confirme la joignabilité réseau).
# Fichier temporaire : à supprimer ou requalifier une fois la question de connectivité tranchée.
#
# Usage : pousser sur `ops/run-script` (même mécanisme que run_script.yml).
name: Test Connectivité Dell (Tailscale)

on:
  push:
    branches: [ ops/run-script ]

jobs:
  ping-dell:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Ping du Dell (100.94.33.54)
        run: |
          echo "--- tailscale status ---"
          tailscale status || true
          echo "--- ping Dell ---"
          tailscale ping --c 4 100.94.33.54
