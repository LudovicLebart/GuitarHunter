# Workflow de test/exécution ponctuelle sur le Dell GPU de MoneyBot (100.94.33.54, tailnet
# partagé — connectivité confirmée le 2026-08-19, `NECK_RESET_VISION_PLAN.md` §7), envisagé
# comme ressource de calcul pour l'inférence vision Phase 0/1 (Florence-2/OWLv2/SAM 2.1) sur
# le Dataset A du projet neck-reset (RTX 2070 SE, 8 Go VRAM — `moneybot/config/cluster_machines.json`).
#
# Distinct de run_script.yml (qui cible le serveur de production GuitarHunter) : cible une
# machine tierce (le Dell de MoneyBot), avec un secret d'accès dédié (`DELL_SSH_PRIVATE_KEY`,
# clé ed25519 générée spécifiquement pour cet usage, ajoutée aux `authorized_keys` du Dell —
# pas la clé MoneyBot existante, pour garder les deux accès révocables indépendamment).
#
# Étape actuelle : test `nvidia-smi` uniquement, pour valider l'accès SSH avant tout script
# d'inférence réel. Usage : pousser sur `ops/run-script` (même mécanisme que run_script.yml).
name: Run One-Off Script (Dell GPU)

on:
  push:
    branches: [ ops/run-script ]

jobs:
  run-on-dell:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Test d'accès SSH + GPU sur le Dell
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 100.94.33.54
          username: ludovic
          key: ${{ secrets.DELL_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 2m
          script: |
            set -e
            echo "--- Identité / hôte ---"
            whoami
            hostname
            echo "--- GPU (nvidia-smi) ---"
            nvidia-smi
            echo "--- Python disponible ---"
            python3 --version
