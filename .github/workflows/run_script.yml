# Workflow dédié à l'exécution ponctuelle d'un script Python avec accès Firebase réel
# (Firestore + Storage), depuis un environnement de dev qui n'a lui-même pas ces credentials.
#
# Contrairement à `deploy.yml` (job `deploy`) :
#   - tourne dans un répertoire SÉPARÉ sur le serveur (~/GuitareHunter-scripts), jamais dans
#     ~/GuitareHunter (le répertoire de production) — aucun `git reset --hard` sur le code en prod.
#   - ne redémarre JAMAIS le service `guitare-hunter` (le bot en production n'est pas affecté).
#   - se déclenche sur la branche dédiée `ops/run-script` uniquement, jamais master/dev.
#
# Usage : pousser la branche à analyser sur `ops/run-script` (ex: git push origin
# <ma-branche>:ops/run-script --force) — le script ci-dessous s'exécute. Le fichier produit
# (voir FICHIER_A_RECUPERER dans l'étape "Récupération du rapport généré") est remonté comme
# artefact GitHub Actions téléchargeable (bouton "Artifacts") ; si le script n'en produit pas,
# cette étape est un no-op toléré, le résultat se lit directement dans les logs du job.
#
# Étape actuellement exécutée : lecture SEULE (grep) des logs de production
# `~/GuitareHunter/logs/bot_*.log` pour les lignes `⏱️` (Chantier H — mesure de l'accélération
# réelle de `_dispatch_analysis_batch`/ANALYSIS_WORKERS, instrumentation déployée 2026-09-19,
# run #515). Ne touche à rien dans ~/GuitareHunter-scripts (pas de git/venv/pip nécessaires pour
# une simple lecture de fichier) ni dans ~/GuitareHunter (lecture seule, `grep`, pas d'écriture).
# Pour lancer un autre script ponctuel, remplacer la commande de l'étape "Exécution du script"
# ci-dessous (et réactiver le rapport/artefact si le script en produit un).
name: Run One-Off Script

on:
  push:
    branches: [ ops/run-script ]

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Exécution du script sur le serveur (lecture seule des logs de production)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -e
            echo "--- Lignes ⏱️ (accélération _dispatch_analysis_batch) dans les logs de production ---"
            if ls ~/GuitareHunter/logs/bot_*.log >/dev/null 2>&1; then
              grep -h "⏱️" ~/GuitareHunter/logs/bot_*.log | tail -100 || echo "Aucune ligne ⏱️ trouvée pour l'instant (pas encore de lot traité depuis le redémarrage du bot)."
              echo "--- Nombre total de lignes ⏱️ trouvées ---"
              grep -h "⏱️" ~/GuitareHunter/logs/bot_*.log | wc -l
            else
              echo "⚠️ Aucun fichier de log trouvé dans ~/GuitareHunter/logs/ — vérifier le chemin de production."
            fi
