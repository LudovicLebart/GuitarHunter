# Workflow dédié à l'exécution ponctuelle d'un script Python avec accès Firebase réel
# (Firestore + Storage), depuis un environnement de dev qui n'a lui-même pas ces credentials.
#
# Contrairement à `deploy.yml` (job `deploy`) :
#   - tourne dans un répertoire SÉPARÉ sur le serveur (~/GuitareHunter-scripts), jamais dans
#     ~/GuitareHunter (le répertoire de production) — aucun `git reset --hard` sur le code en prod.
#   - ne redémarre JAMAIS le service `guitare-hunter` (le bot en production n'est pas affecté).
#   - se déclenche sur la branche dédiée `ops/run-script` uniquement, jamais master/dev.
#
# Usage : pousser la branche à analyser sur `ops/run-script` (ex: git push origin
# <ma-branche>:ops/run-script --force) — le script ci-dessous s'exécute. Le fichier produit
# (voir FICHIER_A_RECUPERER dans l'étape "Récupération du rapport généré") est remonté comme
# artefact GitHub Actions téléchargeable (bouton "Artifacts") ; si le script n'en produit pas,
# cette étape est un no-op toléré, le résultat se lit directement dans les logs du job.
#
# Repointé le 2026-09-22 (lecture seule, pas de git/venv/pip — même principe que le run #517,
# check de la parallélisation) : diagnostic sur la panne "Clé API TokenRouter manquante" reçue
# par email dans la nuit du 2026-09-21 au 2026-09-22, juste après une modification manuelle du
# secret `DOT_ENV` (ajout de `T1_OBSERVATION_ENABLED=false`) — hypothèse à vérifier : l'édition
# du secret a-t-elle accidentellement fait disparaître `TOKENROUTER_API_KEY`, et la panne est-elle
# toujours en cours (le throttle 24h de l'alerte email masquerait une récidive) ? Deux vérifications
# lecture seule : (1) présence non vide de `TOKENROUTER_API_KEY` dans le `DOT_ENV` actuel (juste
# écrit dans un `.env` scratch, jamais affiché en clair) ; (2) fréquence/récence réelle des échecs
# du Portier dans les logs de PRODUCTION (`~/GuitareHunter/logs/`, chemin absolu, lu même si ce job
# tourne dans le répertoire scratch).
# Pour lancer un autre script ponctuel, modifier la commande de l'étape ci-dessous.
name: Run One-Off Script

on:
  push:
    branches: [ ops/run-script ]

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Diagnostic lecture seule (clé TokenRouter + logs Portier de production)
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 5m
          envs: DOT_ENV
          script: |
            echo "--- Présence de TOKENROUTER_API_KEY dans le secret DOT_ENV actuel (valeur jamais affichée) ---"
            if [ -z "$DOT_ENV" ]; then
              echo "⚠️ Secret DOT_ENV manquant."
            elif printf '%s' "$DOT_ENV" | grep -q '^TOKENROUTER_API_KEY=.\+'; then
              echo "✅ TOKENROUTER_API_KEY présente et non vide dans le secret DOT_ENV actuel."
            else
              echo "❌ TOKENROUTER_API_KEY ABSENTE ou vide dans le secret DOT_ENV actuel — c'est la cause."
            fi

            echo ""
            echo "--- Occurrences 'Clé API TokenRouter manquante' dans les logs de PRODUCTION (bot_*.log, incl. rotations) ---"
            grep -h "Clé API TokenRouter manquante" ~/GuitareHunter/logs/bot_*.log* 2>/dev/null | tail -20 || echo "(aucune occurrence trouvée dans les fichiers de log conservés)"

            echo ""
            echo "--- Toutes les erreurs du Portier réel (❌ [Portier réel...) récentes, quelle que soit la cause ---"
            grep -h "❌ \[Portier réel" ~/GuitareHunter/logs/bot_*.log* 2>/dev/null | tail -20 || echo "(aucune occurrence trouvée)"

            echo ""
            echo "--- Dernières décisions du Portier ayant réussi (préuve que ça fonctionne à nouveau, ou pas) ---"
            grep -h "👉 Verdict Portier" ~/GuitareHunter/logs/bot_*.log* 2>/dev/null | tail -10 || echo "(aucune occurrence trouvée)"
