# Workflow dédié à l'exécution ponctuelle d'un script Python avec accès Firebase réel
# (Firestore + Storage), depuis un environnement de dev qui n'a lui-même pas ces credentials.
#
# Contrairement à `deploy.yml` (job `deploy`) :
#   - tourne dans un répertoire SÉPARÉ sur le serveur (~/GuitareHunter-scripts), jamais dans
#     ~/GuitareHunter (le répertoire de production) — aucun `git reset --hard` sur le code en prod.
#   - ne redémarre JAMAIS le service `guitare-hunter` (le bot en production n'est pas affecté).
#   - se déclenche sur la branche dédiée `ops/run-script` uniquement, jamais master/dev.
#
# Usage : pousser la branche à analyser sur `ops/run-script` (ex: git push origin
# <ma-branche>:ops/run-script --force) — le script ci-dessous s'exécute. Le fichier/dossier produit
# (voir DOSSIER_A_RECUPERER dans l'étape "Récupération du rapport généré") est remonté comme
# artefact GitHub Actions téléchargeable (bouton "Artifacts") ; si le script n'en produit pas,
# cette étape est un no-op toléré, le résultat se lit directement dans les logs du job.
#
# Script actuellement exécuté : backend/benchmark/run_benchmark.py (comparatif réel des
# candidats vision — Chantier B, docs/management/plans/CHANTIER_B_PERCEPTION_RAISONNEMENT_PLAN.md
# §7 étape 9bis). Nécessite OPENAI_API_KEY / TOKENROUTER_API_KEY / ANTHROPIC_API_KEY en plus de
# GEMINI_API_KEY (seule clé dont la prod a besoin) — ajoutées directement au secret GitHub
# DOT_ENV (choix explicite de l'utilisateur, 2026-09-08 : plus simple qu'un secret séparé,
# quitte à ce que ces clés benchmark finissent aussi dans le .env du serveur de prod, jamais
# lues par le bot).
# Pour lancer un autre script ponctuel, modifier la commande de l'étape "Exécution du script"
# et le chemin de l'étape "Récupération du rapport généré" ci-dessous.
name: Run One-Off Script

on:
  push:
    branches: [ ops/run-script ]

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Exécution du script sur le serveur (répertoire scratch, hors production)
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 6h
          envs: DOT_ENV,FIREBASE_SERVICE_ACCOUNT_KEY
          script: |
            set -e
            mkdir -p ~/GuitareHunter-scripts
            cd ~/GuitareHunter-scripts

            echo "--- Git Update (répertoire scratch, PAS le répertoire de production) ---"
            # `git init` (pas `git clone .`) : tolère un dossier non vide, notamment des fichiers
            # résiduels (.env, backend/config/serviceAccountKey.json) laissés par un run précédent
            # interrompu avant la fin — `git clone .` échoue dans ce cas (bug rencontré 2x).
            if [ ! -d ".git" ]; then
              echo "Initialisation du dépôt (dossier scratch, éventuels fichiers résiduels tolérés)..."
              git init -q
              git remote add origin https://github.com/${{ github.repository }}.git
            fi
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            echo "--- Configuration .env ---"
            if [ -z "$DOT_ENV" ]; then
              echo "⚠️ Secret DOT_ENV manquant."
            else
              printf '%s' "$DOT_ENV" > .env
              echo "✅ Fichier .env écrit."
            fi

            echo "--- Configuration Firebase ---"
            mkdir -p backend/config
            if [ -z "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
              echo "❌ Secret FIREBASE_SERVICE_ACCOUNT_KEY manquant — abandon."
              exit 1
            fi
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_KEY" > backend/config/serviceAccountKey.json
            echo "✅ Clé Firebase écrite."

            echo "--- Python Environment ---"
            python3 -m venv venv || echo "Venv déjà présent."
            source venv/bin/activate
            pip install -r requirements.txt

            echo "--- Exécution du script ---"
            rm -rf backend/benchmark/results
            # -u (sortie non bufferisée) : sans ça, les logs "out:" restent invisibles jusqu'à
            # la fin (ou le kill par command_timeout) sur un SSH non-interactif — 1er run réel
            # (2026-09-08) tué à 10m sans une seule ligne de progression visible, rendant
            # impossible de distinguer "lent" de "raccroché" (candidat sans timeout, corrigé
            # séparément dans candidates.py/judge.py).
            # Run complet (40 fiches) lancé une fois (run #25, 2026-09-09) puis ANNULÉ après
            # ~15 min : l'axe "valeur" tombait à 0% pour tous les candidats y compris gemini/
            # gemini_pro (prod) — le harnais n'avait pas d'étalon de production. Corrigé par le
            # candidat `analyzer_prod` (vrai Bras A, DealAnalyzer.analyze_deal() tel quel),
            # confirmé sur smoke test #26 (2026-09-09) : seul candidat à score "valeur" non nul,
            # aucune régression sur les 9 autres.
            # Run complet #27 (10 candidats x 40 fiches, terminé 2026-09-09) contaminé en cours
            # de route par un crédit Anthropic épuisé — résolu par une relance ciblée via le
            # nouveau mode `--resume` (run_benchmark.py) : run #28 (qwen/perception_qwen/hybrid
            # confirmés propres) puis run #29 (bug distinct découvert sur `claude_sonnet` —
            # photos Kijiji réellement en WebP malgré leur extension .jpg, envoyées à l'API
            # Anthropic avec un media_type image/jpeg codé en dur, corrigé via
            # `_guess_image_media_type()` — 40/40 propre après relance). Les 10 candidats sont
            # désormais comparables sur les 40 items (voir JOURNAL.md 2026-09-10).
            #
            # Run #30 (2026-09-11) : test ciblé du vrai Bras B (§5 point 5,
            # `portier_perception_test.py`) — accord du Portier (Tier 1) entre Bras A (photos
            # réelles) et Bras B (perception Qwen substituée à `_prepare_visual_parts()`, cascade
            # de prod réelle sinon inchangée) sur les 13 items de la strate `rejet_t1`, à 2
            # paliers de longueur de consigne. Question posée par l'utilisateur avant ce run :
            # pourquoi tester toute la cascade si Tier 1 est ce qui compte — réponse : la cascade
            # s'arrête déjà net dès que T1 rejette (`analyzer.py:356`), donc tester via
            # `analyze_deal()` ne coûte pas plus cher qu'un test T1 isolé, tout en restant fidèle
            # à la prod (pas de drapeau ajouté à `analyzer.py`, pas de logique dupliquée hors
            # cascade réelle). Comparaison au verdict Bras A rejoué DANS ce script (pas au label
            # de strate lui-même, qui reflète un rejet passé possiblement non reproductible
            # aujourd'hui). Résultat : accord Portier 92,3% (court) / 84,6% (long) — pas 100%,
            # pire au palier long (contre-intuitif). Un ukulélé rejeté par le vrai Portier est
            # accepté par le Bras B aux deux paliers (voir JOURNAL.md 2026-09-11).
            #
            # Run #31 (2026-09-12) : extension aux 27 items tier2/tier3 restants — deux nouveaux
            # candidats `bras_b_perception_court`/`_long` (candidates.py, réutilisent la classe
            # `_PerceptionSubstitutedAnalyzer` déplacée depuis portier_perception_test.py), jugés
            # sur les 4 axes (identification/etat/valeur/hallucination) comme les autres candidats
            # — comparés aux scores déjà obtenus par `analyzer_prod` sur ces mêmes items (pas
            # rejoué, économie). Nouveau filtre `--stratum` sur run_benchmark.py pour limiter aux
            # 27 items concernés (les 13 rejet_t1 déjà couverts par run #30).
            python3 -u -m backend.benchmark.run_benchmark \
              --models bras_b_perception_court,bras_b_perception_long \
              --stratum tier2,tier3

      - name: Récupération du rapport généré
        env:
          DOSSIER_A_RECUPERER: backend/benchmark/results
        run: |
          mkdir -p ~/.ssh output
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -r \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/GuitareHunter-scripts/${DOSSIER_A_RECUPERER}" \
            output/ || echo "⚠️ Aucun rapport à récupérer (le script a peut-être échoué ou ne produit pas ce dossier)."

      - name: Publication de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: output/
          if-no-files-found: warn
          retention-days: 14
