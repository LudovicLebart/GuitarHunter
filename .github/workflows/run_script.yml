# Workflow dédié à l'exécution ponctuelle d'un script Python avec accès Firebase réel
# (Firestore + Storage), depuis un environnement de dev qui n'a lui-même pas ces credentials.
#
# Contrairement à `deploy.yml` (job `deploy`) :
#   - tourne dans un répertoire SÉPARÉ sur le serveur (~/GuitareHunter-scripts), jamais dans
#     ~/GuitareHunter (le répertoire de production) — aucun `git reset --hard` sur le code en prod.
#   - ne redémarre JAMAIS le service `guitare-hunter` (le bot en production n'est pas affecté).
#   - se déclenche sur la branche dédiée `ops/run-script` uniquement, jamais master/dev.
#
# Usage : pousser la branche à analyser sur `ops/run-script` (ex: git push origin
# <ma-branche>:ops/run-script --force) — le script ci-dessous s'exécute. Le fichier/dossier produit
# (voir DOSSIER_A_RECUPERER dans l'étape "Récupération du rapport généré") est remonté comme
# artefact GitHub Actions téléchargeable (bouton "Artifacts") ; si le script n'en produit pas,
# cette étape est un no-op toléré, le résultat se lit directement dans les logs du job.
#
# Script actuellement exécuté : backend/benchmark/run_benchmark.py (comparatif réel des
# candidats vision — Chantier B, docs/management/plans/CHANTIER_B_PERCEPTION_RAISONNEMENT_PLAN.md
# §7 étape 9bis). Nécessite OPENAI_API_KEY / TOKENROUTER_API_KEY / ANTHROPIC_API_KEY en plus de
# GEMINI_API_KEY (seule clé dont la prod a besoin) — ajoutées directement au secret GitHub
# DOT_ENV (choix explicite de l'utilisateur, 2026-09-08 : plus simple qu'un secret séparé,
# quitte à ce que ces clés benchmark finissent aussi dans le .env du serveur de prod, jamais
# lues par le bot).
# Pour lancer un autre script ponctuel, modifier la commande de l'étape "Exécution du script"
# et le chemin de l'étape "Récupération du rapport généré" ci-dessous.
name: Run One-Off Script

on:
  push:
    branches: [ ops/run-script ]

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Exécution du script sur le serveur (répertoire scratch, hors production)
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 30m
          envs: DOT_ENV,FIREBASE_SERVICE_ACCOUNT_KEY
          script: |
            set -e
            mkdir -p ~/GuitareHunter-scripts
            cd ~/GuitareHunter-scripts

            echo "--- Git Update (répertoire scratch, PAS le répertoire de production) ---"
            # `git init` (pas `git clone .`) : tolère un dossier non vide, notamment des fichiers
            # résiduels (.env, backend/config/serviceAccountKey.json) laissés par un run précédent
            # interrompu avant la fin — `git clone .` échoue dans ce cas (bug rencontré 2x).
            if [ ! -d ".git" ]; then
              echo "Initialisation du dépôt (dossier scratch, éventuels fichiers résiduels tolérés)..."
              git init -q
              git remote add origin https://github.com/${{ github.repository }}.git
            fi
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            echo "--- Configuration .env ---"
            if [ -z "$DOT_ENV" ]; then
              echo "⚠️ Secret DOT_ENV manquant."
            else
              printf '%s' "$DOT_ENV" > .env
              echo "✅ Fichier .env écrit."
            fi

            echo "--- Configuration Firebase ---"
            mkdir -p backend/config
            if [ -z "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
              echo "❌ Secret FIREBASE_SERVICE_ACCOUNT_KEY manquant — abandon."
              exit 1
            fi
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_KEY" > backend/config/serviceAccountKey.json
            echo "✅ Clé Firebase écrite."

            echo "--- Python Environment ---"
            python3 -m venv venv || echo "Venv déjà présent."
            source venv/bin/activate
            pip install -r requirements.txt

            echo "--- Exécution du script ---"
            rm -rf backend/benchmark/results
            # -u (sortie non bufferisée) : sans ça, les logs "out:" restent invisibles jusqu'à
            # la fin (ou le kill par command_timeout) sur un SSH non-interactif — 1er run réel
            # (2026-09-08) tué à 10m sans une seule ligne de progression visible, rendant
            # impossible de distinguer "lent" de "raccroché" (candidat sans timeout, corrigé
            # séparément dans candidates.py/judge.py).
            python3 -u -m backend.benchmark.run_benchmark --limit 5

      - name: Récupération du rapport généré
        env:
          DOSSIER_A_RECUPERER: backend/benchmark/results
        run: |
          mkdir -p ~/.ssh output
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -r \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/GuitareHunter-scripts/${DOSSIER_A_RECUPERER}" \
            output/ || echo "⚠️ Aucun rapport à récupérer (le script a peut-être échoué ou ne produit pas ce dossier)."

      - name: Publication de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: output/
          if-no-files-found: warn
          retention-days: 14
