<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 375" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Méthode du sac : remettre l'air autour de la guitare à une humidité normale</title>
  <desc id="d">Guitare à plat dans un sac plastique fermé, avec un bol d'eau contenant une éponge et un hygromètre. L'eau reste dans le bol, la vapeur humidifie l'air du sac.</desc>
  <rect width="820" height="375" fill="#f8fafc"/>
<rect x="20" y="50" width="780" height="270" rx="26" fill="#e0f2fe" fill-opacity=".6" stroke="#0284c7" stroke-width="3" stroke-dasharray="10 6"/><text x="410.0" y="38" font-size="16" fill="#0284c7" font-weight="bold" text-anchor="middle">Sac plastique fermé, une nuit</text>
  <g transform="translate(50 190) scale(0.8)"><path d="M0 0 C0 -75 40 -150 105 -150 C160 -150 185 -112 205 -100 C225 -88 245 -118 280 -118 C320 -118 335 -85 345 -50 L345 50 C335 85 320 118 280 118 C245 118 225 88 205 100 C185 112 160 150 105 150 C40 150 0 75 0 0 Z" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="4"/><circle cx="262" cy="0" r="38" fill="#1e293b"/><circle cx="262" cy="0" r="42" fill="none" stroke="#7c4a1e" stroke-width="3"/><rect x="88" y="-42" width="18" height="84" rx="4" fill="#7c4a1e"/><rect x="342" y="-19" width="300" height="38" fill="#7c4a1e"/><path d="M642 -19 L730 -34 L730 34 L642 19 Z" fill="#7c4a1e"/><circle cx="672" cy="-18" r="6" fill="#cbd5e1"/><circle cx="672" cy="0" r="6" fill="#cbd5e1"/><circle cx="672" cy="18" r="6" fill="#cbd5e1"/><circle cx="705" cy="-18" r="6" fill="#cbd5e1"/><circle cx="705" cy="0" r="6" fill="#cbd5e1"/><circle cx="705" cy="18" r="6" fill="#cbd5e1"/></g>
  <path d="M470 235 h120 l-14 46 h-92z" fill="#cbd5e1" stroke="#475569" stroke-width="3"/><rect x="488" y="213" width="84" height="30" rx="9" fill="#fde68a" stroke="#a16207" stroke-width="2"/><path d="M478 263 h104" stroke="#0ea5e9" stroke-width="5"/><g fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round"><path d="M508 207 q-8 -10 0 -20 q8 -10 0 -20"/><path d="M530 207 q-8 -10 0 -20 q8 -10 0 -20"/><path d="M552 207 q-8 -10 0 -20 q8 -10 0 -20"/></g>
  <circle cx="520" cy="115" r="38" fill="#fff" stroke="#475569" stroke-width="3"/><path d="M492 133 a36 36 0 0 1 56 0" fill="none" stroke="#15803d" stroke-width="5" opacity=".8"/><path d="M520 115 l20 -22" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/><text x="520" y="148" font-size="11" fill="#334155" text-anchor="middle">% HR</text>
  <circle cx="250" cy="302" r="15" fill="#0f172a"/><text x="250" y="308" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="275" y="308" font-size="15" fill="#0f172a" text-anchor="start">Guitare à plat</text>
  <circle cx="620" cy="280" r="15" fill="#0f172a"/><text x="620" y="286" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="645" y="286" font-size="15" fill="#0f172a" text-anchor="start">Bol d'eau + éponge</text>
  <circle cx="585" cy="95" r="15" fill="#0f172a"/><text x="585" y="101" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="610" y="101" font-size="15" fill="#0f172a" text-anchor="start">Hygromètre : viser 45 à 55 %</text>
  <text x="410" y="352" font-size="15" fill="#334155" text-anchor="middle">L'eau reste dans le bol : seul l'air du sac s'humidifie (la vapeur ne mouille pas la guitare).</text>
</svg>
