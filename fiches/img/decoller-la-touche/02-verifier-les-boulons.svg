  <text x="470" y="234" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Boulon éventuel, vu depuis l'intérieur de la caisse</text>
  <text x="410" y="336" font-size="14" fill="#334155" text-anchor="middle">Regarder avec un miroir et une lampe par la rosace. Avec un boulon, la rallonge se dévisse.</text>
