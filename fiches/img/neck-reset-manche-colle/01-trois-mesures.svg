<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Les trois mesures avant de déposer le manche</title>
  <desc id="d">Coupe latérale : une règle posée sur les frettes arrive sous le haut du chevalet (écart A) ; B est la hauteur du talon, C la distance du joint au milieu du sillet de chevalet.</desc>
  <rect width="820" height="420" fill="#f8fafc"/>
<text x="410" y="30" font-size="16" fill="#334155" font-weight="bold" text-anchor="middle">À mesurer avant de déposer le manche : A, B et C</text>
  <rect x="330" y="170" width="46" height="140" fill="#e8cf9b" stroke="#7c4a1e" stroke-width="2"/><rect x="376" y="170" width="74" height="12" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/><rect x="580" y="170" width="150" height="12" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/><rect x="330" y="310" width="400" height="10" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/><line x1="330" y1="170" x2="330" y2="320" stroke="#7c4a1e" stroke-width="4"/><text x="515.0" y="204" font-size="13" fill="#334155" text-anchor="middle">rosace</text>
  <rect x="608" y="134" width="64" height="36" fill="#1e293b" stroke="#475569" stroke-width="2"/><rect x="637" y="128" width="6" height="8" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <polygon points="330.0,170.0 366.0,170.0 366.0,220.0 330.0,220.0" fill="#7c4a1e" stroke="#7c4a1e" stroke-width="2"/><polygon points="40.0,170.0 330.0,170.0 330.0,290.0 268.0,290.0 268.0,204.0 40.0,204.0" fill="#7c4a1e" stroke="#7c4a1e" stroke-width="2"/><polygon points="40.0,160.0 500.0,160.0 500.0,170.0 40.0,170.0" fill="#1e293b" stroke="#475569" stroke-width="2"/><line x1="52.0" y1="157.0" x2="52.0" y2="160.0" stroke="#cbd5e1" stroke-width="3"/><line x1="90.0" y1="157.0" x2="90.0" y2="160.0" stroke="#cbd5e1" stroke-width="3"/><line x1="128.0" y1="157.0" x2="128.0" y2="160.0" stroke="#cbd5e1" stroke-width="3"/><line x1="166.0" y1="157.0" x2="166.0" y2="160.0" stroke="#cbd5e1" stroke-width="3"/><line x1="205.0" y1="157.0" x2="205.0" y2="160.0" stroke="#cbd5e1" stroke-width="3"/><line x1="245.0" y1="157.0" x2="245.0" y2="160.0" stroke="#cbd5e1" stroke-width="3"/><line x1="286.0" y1="157.0" x2="286.0" y2="160.0" stroke="#cbd5e1" stroke-width="3"/><line x1="328.0" y1="157.0" x2="328.0" y2="160.0" stroke="#cbd5e1" stroke-width="3"/><line x1="370.0" y1="157.0" x2="370.0" y2="160.0" stroke="#cbd5e1" stroke-width="3"/><line x1="410.0" y1="157.0" x2="410.0" y2="160.0" stroke="#cbd5e1" stroke-width="3"/><line x1="448.0" y1="157.0" x2="448.0" y2="160.0" stroke="#cbd5e1" stroke-width="3"/><line x1="484.0" y1="157.0" x2="484.0" y2="160.0" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="44" y1="154" x2="608" y2="154" stroke="#15803d" stroke-width="5"/>
  <line x1="608" y1="154" x2="696" y2="154" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="330" y1="154" x2="640" y2="134" stroke="#334155" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="52" y="142" font-size="14" fill="#15803d" font-weight="bold" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" paint-order="stroke" text-anchor="start">Règle posée sur les frettes</text>
  <text x="366" y="118" font-size="13" fill="#334155" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" paint-order="stroke" text-anchor="start">règle d'un manche bien réglé : elle touche le haut du chevalet</text>
  <line x1="643" y1="134" x2="702" y2="134" stroke="#334155" stroke-width="1.3" stroke-dasharray="4 3"/>
  <path d="M696 134 L696 154" stroke="#b91c1c" stroke-width="2.5" fill="none"/><polygon points="696,154 690.5,141.1 701.5,141.1" fill="#b91c1c"/><path d="M696 154 L696 134" stroke="#b91c1c" stroke-width="2.5" fill="none"/><polygon points="696,134 701.5,146.9 690.5,146.9" fill="#b91c1c"/>
  <text x="710" y="151.0" font-size="20" fill="#b91c1c" font-weight="bold" text-anchor="start">A</text>
  <line x1="330" y1="156" x2="330" y2="74" stroke="#334155" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="640" y1="124" x2="640" y2="74" stroke="#334155" stroke-width="1.3" stroke-dasharray="4 3"/>
  <path d="M330 80 L640 80" stroke="#0f172a" stroke-width="2.5" fill="none"/><polygon points="640,80 627.1,85.5 627.1,74.5" fill="#0f172a"/><path d="M640 80 L330 80" stroke="#0f172a" stroke-width="2.5" fill="none"/><polygon points="330,80 342.9,74.5 342.9,85.5" fill="#0f172a"/>
  <text x="485.0" y="70" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="middle">C</text>
  <path d="M314 173 L314 287" stroke="#fff" stroke-width="2.5" fill="none"/><polygon points="314,287 308.5,274.1 319.5,274.1" fill="#fff"/><path d="M314 287 L314 173" stroke="#fff" stroke-width="2.5" fill="none"/><polygon points="314,173 319.5,185.9 308.5,185.9" fill="#fff"/>
  <text x="290" y="237.0" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle">B</text>
  <text x="696" y="240" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="middle">X = A × B ÷ C</text>
  <text x="696" y="260" font-size="13" fill="#334155" text-anchor="middle">(coin à retirer</text>
  <text x="696" y="276" font-size="13" fill="#334155" text-anchor="middle">en bas du talon)</text>
  <text x="40" y="350" font-size="14" fill="#0f172a" text-anchor="start">A : écart, au chevalet, entre la règle posée sur les frettes et le haut du chevalet</text>
  <text x="40" y="372" font-size="14" fill="#0f172a" text-anchor="start">B : hauteur du talon, du dessous de la touche au bas du talon  ·  C : du joint au milieu du sillet</text>
  <text x="40" y="394" font-size="14" fill="#0f172a" text-anchor="start">Les trois mesures se prennent avant la dépose ; la formule donne X, à retirer en bas du talon.</text>
</svg>
