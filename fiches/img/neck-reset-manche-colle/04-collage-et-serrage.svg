<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 490" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Coller et serrer le manche et la rallonge de touche</title>
  <desc id="d">Coupe latérale : un serre-joint sur la queue d'aronde (cale fendue sur la touche, cale garnie de liège sous le fond), un second par la rosace pour la rallonge avec une cale sur la barre d'épaule ; colle sur les faces de la queue d'aronde et sous la rallonge ; jeu à blanc sous la rallonge.</desc>
  <rect width="820" height="490" fill="#f8fafc"/>
<text x="410" y="28" font-size="16" fill="#334155" font-weight="bold" text-anchor="middle">Deux serre-joints : un sur la queue d'aronde, un par la rosace pour la rallonge</text>
