  <text x="40" y="378" font-size="14" fill="#0f172a" text-anchor="start">1  Serre-joint sur la queue d'aronde : cale fendue sur la touche, cale garnie de liège sous le fond</text>
  <text x="40" y="400" font-size="14" fill="#0f172a" text-anchor="start">2  Serre-joint par la rosace pour la rallonge : cale fendue dessus, cale qui épouse la barre d'épaule</text>
  <text x="40" y="422" font-size="14" fill="#0f172a" text-anchor="start">3  Colle de peau sur les faces de la queue d'aronde et sous la rallonge de touche (en jaune)</text>
  <text x="40" y="444" font-size="14" fill="#0f172a" text-anchor="start">4  Jeu sous la rallonge, mesuré à blanc : environ 0,5 mm (très exagéré ici)</text>
  <text x="40" y="466" font-size="14" fill="#0f172a" text-anchor="start">Le serre-joint 1 est dessiné vu de face : son corps passe devant la coupe. Une nuit de serrage.</text>
