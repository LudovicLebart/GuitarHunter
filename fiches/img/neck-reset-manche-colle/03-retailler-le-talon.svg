  <text x="40" y="336" font-size="14" fill="#0f172a" text-anchor="start">1  Le coin se retire sur la face du talon qui touche le corps : épaisseur X en bas, nulle en P</text>
  <text x="40" y="358" font-size="14" fill="#0f172a" text-anchor="start">P ne bouge pas : le manche pivote autour de lui, la tête descend, la règle monte vers le haut du chevalet.</text>
  <text x="40" y="380" font-size="14" fill="#0f172a" text-anchor="start">Retirer d'abord les deux tiers de X, le reste à l'essai. Angle et épaisseurs exagérés.</text>
