  <text x="410" y="30" font-size="17" fill="#334155" font-weight="bold" text-anchor="middle">Mesure du relief à la règle crantée (cordes accordées)</text>
  <text x="410" y="300" font-size="14" fill="#334155" text-anchor="middle">On mesure là où le creux est le plus grand : la cale qui passe tout juste donne le creux (0,20 à 0,25 mm visés). Creux exagéré.</text>
