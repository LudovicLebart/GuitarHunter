<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Relief visé par type d'instrument et style de jeu</title>
  <desc id="d">Barres horizontales en pouces et millimètres : électrique 0,004 à 0,008, acoustique 0,006 à 0,012, basse 0,008 à 0,015, classique 0,008 à 0,010, jeu léger à médium environ 0,010, jeu agressif ou capo 0,015 à 0,020.</desc>
  <rect width="820" height="390" fill="#f8fafc"/>
