<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Ordre des essais pour débloquer un truss rod</title>
  <desc id="d">Cinq essais successifs : détendre les cordes, lubrifier, chauffer très doucement, tourner en va-et-vient, soulager la tige ; sinon luthier.</desc>
  <rect width="820" height="330" fill="#f8fafc"/>
<rect x="20" y="90" width="140" height="90" rx="10" fill="#fff" stroke="#0284c7" stroke-width="3"/><text x="90.0" y="118" font-size="15" fill="#0284c7" font-weight="bold" text-anchor="middle">1  Détendre</text><text x="90.0" y="140" font-size="13" fill="#334155" text-anchor="middle">les cordes</text><text x="90.0" y="158" font-size="13" fill="#334155" text-anchor="middle">franchement</text>
  <path d="M162 135 L178 135" stroke="#334155" stroke-width="3" fill="none"/><polygon points="178,135 165.1,140.5 165.1,129.5" fill="#334155"/>
  <rect x="180" y="90" width="140" height="90" rx="10" fill="#fff" stroke="#0284c7" stroke-width="3"/><text x="250.0" y="118" font-size="15" fill="#0284c7" font-weight="bold" text-anchor="middle">2  Lubrifier</text><text x="250.0" y="140" font-size="13" fill="#334155" text-anchor="middle">l'écrou, quelques</text><text x="250.0" y="158" font-size="13" fill="#334155" text-anchor="middle">minutes à heures</text>
  <path d="M322 135 L338 135" stroke="#334155" stroke-width="3" fill="none"/><polygon points="338,135 325.1,140.5 325.1,129.5" fill="#334155"/>
  <rect x="340" y="90" width="140" height="90" rx="10" fill="#fff" stroke="#0284c7" stroke-width="3"/><text x="410.0" y="118" font-size="15" fill="#0284c7" font-weight="bold" text-anchor="middle">3  Chauffer</text><text x="410.0" y="140" font-size="13" fill="#334155" text-anchor="middle">très doucement</text><text x="410.0" y="158" font-size="13" fill="#334155" text-anchor="middle">(jamais de flamme)</text>
  <path d="M482 135 L498 135" stroke="#334155" stroke-width="3" fill="none"/><polygon points="498,135 485.1,140.5 485.1,129.5" fill="#334155"/>
  <rect x="500" y="90" width="140" height="90" rx="10" fill="#fff" stroke="#0284c7" stroke-width="3"/><text x="570.0" y="118" font-size="15" fill="#0284c7" font-weight="bold" text-anchor="middle">4  Va-et-vient</text><text x="570.0" y="140" font-size="13" fill="#334155" text-anchor="middle">petits mouvements</text><text x="570.0" y="158" font-size="13" fill="#334155" text-anchor="middle">dans les deux sens</text>
  <path d="M642 135 L658 135" stroke="#334155" stroke-width="3" fill="none"/><polygon points="658,135 645.1,140.5 645.1,129.5" fill="#334155"/>
  <rect x="660" y="90" width="140" height="90" rx="10" fill="#fff" stroke="#0284c7" stroke-width="3"/><text x="730.0" y="118" font-size="15" fill="#0284c7" font-weight="bold" text-anchor="middle">5  Soulager</text><text x="730.0" y="140" font-size="13" fill="#334155" text-anchor="middle">la tige : légère</text><text x="730.0" y="158" font-size="13" fill="#334155" text-anchor="middle">flexion du manche</text>
  <text x="410" y="50" font-size="18" fill="#334155" font-weight="bold" text-anchor="middle">Dans cet ordre, en s'arrêtant dès que ça tourne</text>
  <path d="M410 190 V225" stroke="#b91c1c" stroke-width="3" stroke-dasharray="6 4"/>
  <rect x="130" y="225" width="560" height="78" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="3"/><text x="410.0" y="253" font-size="15" fill="#b91c1c" font-weight="bold" text-anchor="middle">Toujours bloqué, écrou qui s'arrondit, craquement ?</text><text x="410.0" y="275" font-size="13" fill="#334155" text-anchor="middle">S'arrêter et confier l'instrument à un luthier</text>
</svg>
