<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Coller la cale et serrer par la rosace</title>
  <desc id="d">Coupe latérale : un serre-joint en C appuie sur le bout de la rallonge et, par la rosace, sur une cale de serrage sous la table.</desc>
  <rect width="820" height="330" fill="#f8fafc"/>
<g transform="rotate(-8.8 230 170)"><rect x="120" y="170" width="110" height="70" fill="#7c4a1e"/><rect x="120" y="161" width="330" height="9" fill="#1e293b" stroke="#475569" stroke-width="2"/></g><rect x="230" y="170" width="290" height="14" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/><polygon points="230,170 447.4,170 447.4,136.3" fill="#fbbf24" stroke="#a16207" stroke-width="2"/>
  <rect x="367" y="184" width="100" height="16" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <path d="M417 60 H517 V248 H417" stroke="#475569" stroke-width="7" fill="none" stroke-linejoin="round"/>
  <path d="M417.4102439182416 60.34311601751162 L417.4102439182416 120.34311601751162" stroke="#dc2626" stroke-width="3" fill="none"/><polygon points="417.4102439182416,120.34311601751162 412.0,107.4 422.9,107.4" fill="#dc2626"/>
  <path d="M417.4102439182416 248 L417.4102439182416 204" stroke="#dc2626" stroke-width="3" fill="none"/><polygon points="417.4102439182416,204 422.9,216.9 412.0,216.9" fill="#dc2626"/>
  <circle cx="315" cy="118" r="15" fill="#0f172a"/><text x="315" y="124" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <circle cx="567.4102439182416" cy="320" r="15" fill="#0f172a"/><text x="567.4102439182416" y="326" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <circle cx="567.4102439182416" cy="36.34311601751162" r="15" fill="#0f172a"/><text x="567.4102439182416" y="42.34311601751162" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <path d="M315 134 L340 158" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <text x="170" y="100" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Colle de peau : cale, puis rallonge</text>
  <text x="592.4102439182416" y="320" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Cale de serrage sous la table</text>
  <text x="592.4102439182416" y="340" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">(passée par la rosace)</text>
  <text x="592.4102439182416" y="42.34311601751162" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Serre-joint en C</text>
  <text x="410" y="30" font-size="15" fill="#334155" font-weight="bold" text-anchor="middle">La colle de peau chaude fige vite : tout est préparé et répété à blanc avant d'encoller</text>
</svg>
