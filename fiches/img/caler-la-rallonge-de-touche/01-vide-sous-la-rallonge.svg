<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Vide sous la rallonge de touche après un neck reset</title>
  <desc id="d">Coupe latérale : à gauche la rallonge décolle de la table après le reset ; à droite une cale en coin du même bois que la touche comble le vide.</desc>
  <rect width="820" height="350" fill="#f8fafc"/>
<g transform="rotate(-8.8 130 170)"><rect x="20" y="170" width="110" height="70" fill="#7c4a1e"/><rect x="20" y="161" width="330" height="9" fill="#1e293b" stroke="#475569" stroke-width="2"/></g><rect x="130" y="170" width="290" height="14" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/>
  <g transform="rotate(-8.8 550 170)"><rect x="440" y="170" width="110" height="70" fill="#7c4a1e"/><rect x="440" y="161" width="330" height="9" fill="#1e293b" stroke="#475569" stroke-width="2"/></g><rect x="550" y="170" width="290" height="14" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/><polygon points="550,170 767.4,170 767.4,136.3" fill="#fbbf24" stroke="#a16207" stroke-width="2"/>
  <text x="210" y="42" font-size="16" fill="#0f172a" font-weight="bold" text-anchor="middle">Après le reset : la rallonge décolle</text>
  <text x="630" y="42" font-size="16" fill="#15803d" font-weight="bold" text-anchor="middle">Une cale en coin comble le vide</text>
  <circle cx="250" cy="100" r="15" fill="#0f172a"/><text x="250" y="106" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <circle cx="377.4102439182416" cy="156" r="15" fill="#0f172a"/><text x="377.4102439182416" y="162" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <circle cx="797.4102439182416" cy="156" r="15" fill="#0f172a"/><text x="797.4102439182416" y="162" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <text x="40" y="285" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">1  Rallonge de touche</text>
  <text x="40" y="305" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">2  Vide qui grandit vers le bout</text>
  <text x="440" y="285" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">3  Cale : même bois que la touche, amincie vers le joint</text>
  <text x="410" y="338" font-size="14" fill="#334155" text-anchor="middle">Écart exagéré sur le dessin. Au-delà de la tolérance, on cale plutôt que de forcer la rallonge à plat.</text>
</svg>
