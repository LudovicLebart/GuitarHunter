<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Fabriquer la cale en coin à la ponceuse à bande</title>
  <desc id="d">Coupe latérale : la planche support et la pièce, collées au double face, sont appuyées sur la bande ; l'appui est plus fort côté mince, qui est ponçu davantage.</desc>
  <rect width="820" height="340" fill="#f8fafc"/>
<text x="410" y="28" font-size="15" fill="#334155" font-weight="bold" text-anchor="middle">Ponceuse à bande : la pièce reste collée à la planche, qu'on appuie plus fort côté mince</text>
  <g transform="rotate(2.5 200 170)"><rect x="200" y="150" width="500" height="30" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/><rect x="250" y="180" width="320" height="4" fill="#fde68a" stroke="#a16207" stroke-width="1"/><rect x="250" y="184" width="320" height="30" fill="#7c4a1e" stroke="#475569" stroke-width="2"/></g>
  <rect x="130" y="231" width="620" height="12" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <rect x="130" y="243" width="620" height="24" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/>
  <path d="M620 98 L620 160" stroke="#dc2626" stroke-width="3" fill="none"/><polygon points="620,160 614.5,147.1 625.5,147.1" fill="#dc2626"/>
  <path d="M260 118 L260 140" stroke="#dc2626" stroke-width="3" fill="none"/><polygon points="260,140 254.5,127.1 265.5,127.1" fill="#dc2626"/>
  <text x="640" y="120" font-size="14" fill="#dc2626" font-weight="bold" text-anchor="start">appui plus fort côté mince</text>
  <text x="130" y="108" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">appui léger</text>
  <text x="440" y="262" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="middle">Bande abrasive en mouvement</text>
  <text x="410" y="296" font-size="14" fill="#334155" text-anchor="middle">Planche plane, double face et pièce : le côté le plus appuyé est le plus ponçu, donc le plus mince.</text>
  <text x="410" y="318" font-size="14" fill="#334155" text-anchor="middle">Poncer court, mesurer, recommencer. Finir à la main pour ne pas passer sous l'épaisseur voulue.</text>
</svg>
