<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 375" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Ajuster la cale à blanc</title>
  <desc id="d">Deux coupes : à gauche la cale épouse le dessous de la rallonge sans jour ; à droite la cale est trop mince et laisse un jour.</desc>
  <rect width="820" height="375" fill="#f8fafc"/>
<text x="190" y="42" font-size="16" fill="#15803d" font-weight="bold" text-anchor="middle">Cale ajustée : aucun jour</text>
  <text x="610" y="42" font-size="16" fill="#b91c1c" font-weight="bold" text-anchor="middle">Cale trop mince : jour sous la rallonge</text>
