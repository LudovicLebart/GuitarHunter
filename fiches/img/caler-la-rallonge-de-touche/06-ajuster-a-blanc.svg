  <text x="410" y="318" font-size="14" fill="#334155" text-anchor="middle">Serrer à blanc, sans colle : la rallonge repose sur la cale sur toute sa longueur,</text>
  <text x="410" y="341" font-size="14" fill="#334155" text-anchor="middle">sans être relevée ni forcée. Si la table est bombée, courber un peu le dessous de la cale.</text>
</svg>
