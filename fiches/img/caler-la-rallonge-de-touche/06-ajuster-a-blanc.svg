<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Ajuster la cale à blanc</title>
  <desc id="d">Deux coupes : à gauche la cale épouse le dessous de la rallonge sans jour ; à droite la cale est trop mince et laisse un jour.</desc>
  <rect width="820" height="340" fill="#f8fafc"/>
<g transform="rotate(-8.8 130 170)"><rect x="20" y="170" width="110" height="70" fill="#7c4a1e"/><rect x="20" y="161" width="330" height="9" fill="#1e293b" stroke="#475569" stroke-width="2"/></g><rect x="130" y="170" width="290" height="14" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/><polygon points="130,170 347.4,170 347.4,136.3" fill="#fbbf24" stroke="#a16207" stroke-width="2"/>
  <g transform="rotate(-8.8 550 170)"><rect x="440" y="170" width="110" height="70" fill="#7c4a1e"/><rect x="440" y="161" width="330" height="9" fill="#1e293b" stroke="#475569" stroke-width="2"/></g><rect x="550" y="170" width="290" height="14" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/><polygon points="550,170 767.4,170 767.4,151.5" fill="#fbbf24" stroke="#a16207" stroke-width="2"/><polygon points="550,170 767.4,151.5 767.4,136.3" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="190" y="42" font-size="16" fill="#15803d" font-weight="bold" text-anchor="middle">Cale ajustée : aucun jour</text>
  <text x="610" y="42" font-size="16" fill="#b91c1c" font-weight="bold" text-anchor="middle">Cale trop mince : jour sous la rallonge</text>
  <circle cx="387.4102439182416" cy="70" r="16" fill="#15803d"/><text x="387.4102439182416" y="77" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">✓</text>
  <circle cx="807.4102439182416" cy="70" r="16" fill="#b91c1c"/><text x="807.4102439182416" y="77" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">✗</text>
  <text x="410" y="285" font-size="14" fill="#334155" text-anchor="middle">Serrer à blanc, sans colle : la rallonge repose sur la cale sur toute sa longueur,</text>
  <text x="410" y="308" font-size="14" fill="#334155" text-anchor="middle">sans être relevée ni forcée. Si la table est bombée, courber un peu le dessous de la cale.</text>
</svg>
