<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Préparer les surfaces avant collage</title>
  <desc id="d">Coupe latérale : l'ancienne colle est retirée sous la rallonge et sur la table, sans toucher à la finition de la table autour.</desc>
  <rect width="820" height="290" fill="#f8fafc"/>
<g transform="rotate(-8.8 220 170)"><rect x="110" y="170" width="110" height="70" fill="#7c4a1e"/><rect x="110" y="161" width="330" height="9" fill="#1e293b" stroke="#475569" stroke-width="2"/></g><rect x="220" y="170" width="290" height="14" fill="#f1dcb0" stroke="#7c4a1e" stroke-width="2"/>
  <circle cx="350" cy="108" r="15" fill="#0f172a"/><text x="350" y="114" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <circle cx="340" cy="232" r="15" fill="#0f172a"/><text x="340" y="238" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <path d="M350 124 L370 132" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <path d="M340 216 L340 188" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <text x="376" y="112" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Dessous de la rallonge : retirer l'ancienne colle</text>
  <text x="366" y="238" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Table : même chose, vernis intact autour</text>
  <text x="410" y="30" font-size="16" fill="#334155" font-weight="bold" text-anchor="middle">Surfaces propres et saines avant d'essayer la cale</text>
</svg>
