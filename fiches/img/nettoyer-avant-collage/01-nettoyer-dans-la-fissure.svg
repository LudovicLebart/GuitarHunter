<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Nettoyer l'intérieur d'une fissure sans toucher au vernis</title>
  <desc id="d">Coupe de la table : ruban de masquage de chaque côté de la fissure, coton-tige au naphta passé dans la fissure, poussière soufflée à l'air comprimé.</desc>
  <rect width="820" height="300" fill="#f8fafc"/>
  <polygon points="40,180 385,180 385,215 40,215" fill="#f1dcb0" stroke="#475569" stroke-width="2"/>
  <polygon points="435,180 780,180 780,215 435,215" fill="#f1dcb0" stroke="#475569" stroke-width="2"/>
  <rect x="40" y="172" width="345" height="8" fill="#b45309" opacity=".55"/>
  <rect x="435" y="172" width="345" height="8" fill="#b45309" opacity=".55"/>
  <text x="140" y="165" font-size="12.5" fill="#92400e">vernis</text>
  <rect x="330" y="160" width="55" height="12" fill="#fde68a" stroke="#a16207"/>
  <rect x="435" y="160" width="55" height="12" fill="#fde68a" stroke="#a16207"/>
  <text x="357" y="150" font-size="12.5" fill="#a16207" text-anchor="middle">ruban</text>
  <text x="462" y="150" font-size="12.5" fill="#a16207" text-anchor="middle">ruban</text>
  <rect x="397" y="60" width="16" height="70" rx="3" fill="#e2e8f0" stroke="#475569"/>
  <ellipse cx="405" cy="145" rx="11" ry="22" fill="#ffffff" stroke="#475569"/>
  <path d="M405 130 v70" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="3 3"/>
  <text x="425" y="95" font-size="13" fill="#0f172a">coton-tige au naphta</text>
  <text x="425" y="113" font-size="12" fill="#334155">dans la fissure seulement</text>
  <path d="M600 90 l-120 70" stroke="#16a34a" stroke-width="3" fill="none"/>
  <polygon points="476,158 492,150 488,164" fill="#16a34a"/>
  <text x="610" y="88" font-size="13" fill="#15803d">1. air comprimé :</text>
  <text x="610" y="106" font-size="13" fill="#15803d">souffler la poussière</text>
  <text x="610" y="124" font-size="12" fill="#334155">2. puis naphta (coton-tige)</text>
  <text x="410" y="260" font-size="13" fill="#334155" text-anchor="middle">Le ruban protège le vernis ; aérer, aucune flamme (naphta inflammable).</text>
</svg>
